<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Bus body -->
  <rect x="3" y="7" width="26" height="15" rx="3" fill="#0E7B4F"/>
  <!-- Windshield stripe -->
  <rect x="3" y="7" width="26" height="3" rx="3" fill="#0B6040"/>
  <!-- Windows -->
  <rect x="6"  y="11" width="5" height="5" rx="1.5" fill="white" opacity="0.95"/>
  <rect x="13.5" y="11" width="5" height="5" rx="1.5" fill="white" opacity="0.95"/>
  <rect x="21" y="11" width="5" height="5" rx="1.5" fill="white" opacity="0.95"/>
  <!-- Undercarriage -->
  <rect x="3" y="20" width="26" height="3" rx="0" fill="#0B6040"/>
  <!-- Wheels -->
  <circle cx="9"  cy="25" r="3.5" fill="#0E7B4F"/>
  <circle cx="9"  cy="25" r="1.8" fill="white"/>
  <circle cx="23" cy="25" r="3.5" fill="#0E7B4F"/>
  <circle cx="23" cy="25" r="1.8" fill="white"/>
</svg>
